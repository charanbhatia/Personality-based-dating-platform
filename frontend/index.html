<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f4" />
    <meta
      name="description"
      content="Kindred — a dating platform that matches you on personality, values and the way you think, not just looks."
    />

    <!-- Link previews. A dating app gets shared in chats, so the unfurl is the
         first thing most people see of it. On deploy, make the image URLs
         absolute (https://your-domain/og-cover.png) — several unfurlers refuse
         to resolve a relative og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kindred" />
    <meta property="og:title" content="Kindred · Meet minds, not just faces" />
    <meta
      property="og:description"
      content="Matched on personality, values and the way you think — so every match is someone worth talking to."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kindred · Meet minds, not just faces" />
    <meta
      name="twitter:description"
      content="Matched on personality, values and the way you think — so every match is someone worth talking to."
    />
    <meta name="twitter:image" content="/og-cover.png" />
    <link rel="preload" href="/fonts/jakarta-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Applied before first paint. Waiting for React would flash the wrong
         ground at anyone who chose a theme, which is exactly who notices.
         Light is the default, so a device set to dark still gets the designed
         palette unless the reader opts in. -->
    <script>
      (function () {
        var dark = '#16110f';
        var light = '#fff8f4';
        var resolved = 'light';
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark') resolved = 'dark';
          else if (t === 'system')
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {
          /* storage unavailable: fall through to the light default */
        }
        // Set explicitly either way so the prefers-color-scheme rule only wins
        // when the reader actually asked to follow the system.
        document.documentElement.setAttribute('data-theme', resolved);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', resolved === 'dark' ? dark : light);
      })();
    </script>
    <title>Kindred · Meet minds, not just faces</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
